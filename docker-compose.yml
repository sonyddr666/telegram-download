services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: "${API_ID:?Defina API_ID no Coolify}"
      TELEGRAM_API_HASH: "${API_HASH:?Defina API_HASH no Coolify}"
      TELEGRAM_LOCAL: "1"
    expose:
      - "8081"
    volumes:
      - telegram-api-data:/var/lib/telegram-bot-api
      - downloads-data:/downloads
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    environment:
      BOT_TOKEN: "${BOT_TOKEN:?Defina BOT_TOKEN no Coolify}"
      ALLOWED_USER_ID: "${ALLOWED_USER_ID:-5619062865}"
      DOWNLOADS_DIR: "/downloads"
      BOT_API_URL: "http://telegram-bot-api:8081/bot"
      MAX_CONCURRENT_DOWNLOADS: "${MAX_CONCURRENT_DOWNLOADS:-1}"
      DELETE_AFTER_SEND: "${DELETE_AFTER_SEND:-true}"
    volumes:
      - downloads-data:/downloads
    depends_on:
      - telegram-bot-api
    restart: unless-stopped

  web-downloader:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    command: ["gunicorn", "--bind", "0.0.0.0:7776", "--workers", "1", "--threads", "4", "--timeout", "0", "web_app:app"]
    environment:
      WEB_PORT: "7776"
      WEB_DOWNLOADS_DIR: "/downloads/web"
      WEB_MAX_CONCURRENT_DOWNLOADS: "${WEB_MAX_CONCURRENT_DOWNLOADS:-1}"
      WEB_MAX_FILE_SIZE: "${WEB_MAX_FILE_SIZE:-2147483648}"
      WEB_JOB_TTL_SECONDS: "${WEB_JOB_TTL_SECONDS:-3600}"
    ports:
      - "7776:7776"
    volumes:
      - downloads-data:/downloads
    restart: unless-stopped

volumes:
  telegram-api-data:
  downloads-data:
